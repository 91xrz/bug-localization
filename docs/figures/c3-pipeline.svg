<title id="title">原报告与功能假设双路语义检索及证据重排流程</title>
<desc id="desc">当前 C3 方法。两路共享代码向量库，假设前40个文件与原文补足至50个文件，每文件原文第一块与假设补足至三块。原报告重排，文件Max聚合。标签仅用于评价。微调为计划扩展。</desc>
